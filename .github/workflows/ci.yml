name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---------------------------------------------------------------------------
  # Rust workspace
  # ---------------------------------------------------------------------------
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install protoc
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler

      - name: Cache Cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked

  # ---------------------------------------------------------------------------
  # Python package
  # ---------------------------------------------------------------------------
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Type-check (mypy)
        run: mypy src/

      - name: Test with coverage
        run: |
          pytest tests/ \
            --ignore=tests/gold_eval.py \
            --cov=src \
            --cov-report=term-missing \
            --cov-fail-under=80

  # ---------------------------------------------------------------------------
  # Docker — build & push to GCR
  #
  # Required GitHub configuration:
  #   Variables (Settings → Secrets and variables → Variables):
  #     GCP_PROJECT          — GCP project ID (e.g. my-project-123)
  #
  #   Secrets (Settings → Secrets and variables → Actions):
  #     WIF_PROVIDER         — Workload Identity provider resource name
  #                            projects/<n>/locations/global/workloadIdentityPools/<pool>/providers/<prov>
  #     WIF_SERVICE_ACCOUNT  — SA email allowed to push to GCR
  #                            e.g. github-actions@<project>.iam.gserviceaccount.com
  #
  # Runs only on push to main (not on pull-request branches).
  # ---------------------------------------------------------------------------
  docker:
    name: Docker (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [rust, python]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write   # required for Workload Identity Federation

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: engine-grpc
            dockerfile: Dockerfile.grpc
          - image: engine-api
            dockerfile: Dockerfile.api

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Configure Docker credential helper for GCR
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: tags
        run: |
          SHORT_SHA="${GITHUB_SHA::8}"
          REPO="gcr.io/${{ vars.GCP_PROJECT }}/${{ matrix.image }}"
          echo "latest=${REPO}:latest"       >> "$GITHUB_OUTPUT"
          echo "sha=${REPO}:${SHORT_SHA}"    >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ steps.tags.outputs.latest }}
            ${{ steps.tags.outputs.sha }}
          # Re-use GitHub Actions cache across builds to avoid paying for
          # full Rust/pip dependency compilation on every push.
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
